<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: 0; }
    #result { margin-top: 1rem; }
    .notice { padding: .75rem 1rem; border-radius: .4rem; }
    .notice.warn { background: #fff4e5; border: 1px solid #f0b46c; }
    .notice.error { background: #fdecec; border: 1px solid #e08a8a; }
    .draft { padding: .75rem 1rem; border: 1px solid #ccc; border-radius: .4rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");
    let lastRequestId = 0;

    function el(tag, props = {}, text = "") {
      const node = document.createElement(tag);
      Object.assign(node, props);
      node.textContent = text;
      return node;
    }

    function showNotice(kind, text) {
      result.replaceChildren(el("p", { className: `notice ${kind}` }, text));
    }

    function render(data) {
      if (data.status === "ready") {
        result.replaceChildren(
          el("p", {}, `Тема: ${TOPIC_LABELS[data.topic] ?? data.topic}`),
          el("p", {}, "Черновик ответа (проверьте перед отправкой клиенту):"),
          el("pre", { className: "draft" }, data.draft),
        );
      } else if (data.status === "manual_review") {
        showNotice("warn", "Автоматический разбор не удался. Определите тему и подготовьте ответ вручную.");
      } else if (data.status === "invalid_input") {
        showNotice("error", "Введите текст заявки.");
      } else {
        showNotice("error", "Не удалось обработать заявку. Попробуйте ещё раз.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequestId;
      // Сразу убираем предыдущий результат, чтобы старый черновик не остался на экране.
      result.replaceChildren(el("p", {}, "Разбираем заявку…"));
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        if (requestId === lastRequestId) render(data);
      } catch {
        if (requestId === lastRequestId) showNotice("error", "Сервер недоступен. Попробуйте ещё раз.");
      } finally {
        if (requestId === lastRequestId) button.disabled = false;
      }
    });
  </script>
</body>
</html>
